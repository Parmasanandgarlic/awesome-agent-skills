name: Reusable Portfolio Security Audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Credential, history, workflow, and packaging audit
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, re, subprocess, sys
          from pathlib import Path

          failures, warnings, historical = [], [], []
          templates = {'.env.example','env.example','.env.sample','env.sample'}
          forbidden_file = re.compile(r'(^|/)(?:\.env(?:\..+)?|\.pypirc|\.netrc|credentials\.json|service-account[^/]*\.json|id_(?:rsa|ed25519)|[^/]+\.(?:pem|p12|pfx|key|jks|keystore))$', re.I)
          placeholders = ('your_', 'your-', 'example', 'placeholder', 'replace_', 'replace-', '<redacted>', '<secret>')
          patterns = [
            ('private/wallet key', re.compile(r'(?i)(?:private|wallet|secret|clean|compromised)[_ -]*(?:key|keypair|pk)[^\n]{0,100}?(?:0x)?[0-9a-f]{64}')),
            ('generic secret assignment', re.compile(r'''(?ix)(?:API[_-]?KEY|API[_-]?TOKEN|PRIVATE[_-]?KEY|WALLET[_-]?PRIVATE[_-]?KEY|SECRET[_-]?KEY|CLIENT[_-]?SECRET|APP[_-]?SECRET|JWT[_-]?SECRET|AUTH[_-]?SECRET|AUTH[_-]?TOKEN|ACCESS[_-]?TOKEN|SERVICE[_-]?ROLE[_-]?KEY|SESSION[_-]?STRING|ENCRYPTION[_-]?KEY|DISCORD[_-]?BOT[_-]?TOKEN|TELEGRAM[_-]?BOT[_-]?TOKEN|PASSWORD)[ \t]*[:=][ \t]*["']?(?!your[_-]|example|replace|change|placeholder|process\.|process\[|os\.|env\.|import\.meta|\$\{|<)[A-Za-z0-9+/=_:.@-]{20,}''')),
            ('Solana keypair array', re.compile(r'(?is)(?:secret|private|wallet)[_ -]*(?:key|keypair|pk)[^=\n]{0,60}[=:]\s*\[(?:\s*\d{1,3}\s*,){31,}\s*\d{1,3}\s*\]')),
            ('Solana base58 secret', re.compile(r'(?i)(?:private|secret|wallet)[_ -]*(?:key|keypair|pk)[^\n]{0,80}?[=:][ \t]*["\']?[1-9A-HJ-NP-Za-km-z]{80,100}')),
            ('seed phrase', re.compile(r'(?i)(?:mnemonic|seed[_ -]*phrase)[ \t]*[:=][ \t]*["\']?(?:[a-z]{3,12}\s+){11,23}[a-z]{3,12}')),
            ('PEM private key', re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
            ('GitHub token', re.compile(r'\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})\b')),
            ('OpenAI/OpenRouter key', re.compile(r'\b(?:sk-(?:proj-)?|sk-or-v1-)[A-Za-z0-9_-]{20,}\b')),
            ('Anthropic key', re.compile(r'\bsk-ant-[A-Za-z0-9_-]{20,}\b')),
            ('Google OAuth secret', re.compile(r'\bGOCSPX-[A-Za-z0-9_-]{20,}\b')),
            ('Google API key', re.compile(r'\bAIza[0-9A-Za-z_-]{30,}\b')),
            ('AWS access key', re.compile(r'\b(?:AKIA|ASIA)[0-9A-Z]{16}\b')),
            ('Telegram token', re.compile(r'\b\d{8,12}:[A-Za-z0-9_-]{30,}\b')),
            ('Stripe live key', re.compile(r'\b(?:sk|rk)_live_[A-Za-z0-9]{16,}\b')),
            ('Slack token', re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{20,}\b')),
            ('package/registry token', re.compile(r'\b(?:npm_|glpat-|hf_)[A-Za-z0-9_-]{20,}\b')),
            ('keyed RPC', re.compile(r'https?://[^\s"\']*(?:(?:alchemy\.com/v2|infura\.io/v3)/[A-Za-z0-9_-]{16,}|(?:helius-rpc\.com|helius\.xyz)[^\s"\']*api-key=[A-Za-z0-9_-]{16,})', re.I)),
            ('URL credentials', re.compile(r'(?i)https?://[^\s/:@]{1,100}:[^\s/@]{8,}@[^\s/]+')),
          ]
          jwt_re = re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b')

          def placeholder(s): return any(x in s.lower() for x in placeholders)
          def firebase_public(path, label): return Path(path).name == 'firebase-applet-config.json' and label == 'Google API key'
          def service_role_jwt(text):
            for token in jwt_re.findall(text):
              try:
                payload = token.split('.')[1] + '=' * (-len(token.split('.')[1]) % 4)
                if str(json.loads(base64.urlsafe_b64decode(payload)).get('role','')).lower() == 'service_role': return True
              except Exception: pass
            return False
          def scan_text(path, text):
            out=[]
            if service_role_jwt(text): out.append((path,'Supabase/service-role JWT'))
            for label, pat in patterns:
              m=pat.search(text)
              if m and not firebase_public(path,label) and not placeholder(m.group(0)): out.append((path,label))
            return out

          tracked=[x for x in subprocess.check_output(['git','ls-files','-z']).decode(errors='ignore').split('\0') if x]
          for file in tracked:
            p=Path(file); base=p.name; normalized=file.replace('\\','/')
            if forbidden_file.search(normalized) and base not in templates: failures.append((file,'credential-bearing filename'))
            try:
              if p.stat().st_size > 8_000_000:
                warnings.append(f'current file not content-scanned (>8 MB): {file}'); continue
              text=p.read_text('utf-8',errors='ignore')
            except Exception: continue
            if base == '.npmrc' and '_authToken=' in text and '${' not in text: failures.append((file,'literal npm registry credential'))
            if text.startswith('version https://git-lfs.github.com/spec/v1'): warnings.append(f'Git LFS content not scanned: {file}')
            failures.extend(scan_text(file,text))

          try:
            for row in subprocess.check_output(['git','ls-files','--stage'],text=True,errors='ignore').splitlines():
              if row.startswith('160000 '): warnings.append(f'git submodule not recursively scanned: {row.rsplit(chr(9),1)[-1]}')
          except Exception: pass

          seen=set()
          for row in subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='ignore').splitlines():
            parts=row.split(' ',1); oid=parts[0]; path=parts[1] if len(parts)>1 else '<unknown>'
            if oid in seen: continue
            seen.add(oid); base=Path(path).name
            if forbidden_file.search(path.replace('\\','/')) and base not in templates: historical.append((path,'historical credential-bearing filename'))
            try:
              if subprocess.check_output(['git','cat-file','-t',oid],text=True,stderr=subprocess.DEVNULL).strip()!='blob': continue
              size=int(subprocess.check_output(['git','cat-file','-s',oid],text=True,stderr=subprocess.DEVNULL).strip())
              if size>4_000_000: warnings.append(f'historical blob not content-scanned (>4 MB): {path}'); continue
              blob=subprocess.check_output(['git','cat-file','-p',oid],stderr=subprocess.DEVNULL).decode('utf-8',errors='ignore')
            except Exception: continue
            found=scan_text(path,blob)
            if found: historical.append(found[0])

          # Workflow structure checks. Strip literal run-script blocks before looking
          # for workflow triggers so detector source code cannot flag itself.
          workflow_paths=list(Path('.github/workflows').glob('*.yml'))+list(Path('.github/workflows').glob('*.yaml')) if Path('.github/workflows').exists() else []
          mutable=re.compile(r'uses:\s*([^\s]+)@(main|master|latest|HEAD)\b',re.I)
          version_tag=re.compile(r'uses:\s*([^\s]+)@v\d+(?:\.\d+)*\b',re.I)
          untrusted=re.compile(r'\$\{\{\s*github\.event\.pull_request\.(?:title|body|head\.ref|head\.label)\s*\}\}')
          def structural_yaml(text):
            out=[]; skip_indent=None
            for line in text.splitlines():
              indent=len(line)-len(line.lstrip(' '))
              if skip_indent is not None:
                if line.strip() and indent>skip_indent: continue
                skip_indent=None
              if re.match(r'^\s*run:\s*[|>]\s*$',line): skip_indent=indent; continue
              out.append(line)
            return '\n'.join(out)
          target_trigger='pull_request' + '_target:'
          for path in workflow_paths:
            raw=path.read_text('utf-8',errors='ignore'); text=structural_yaml(raw)
            if re.search(r'(?m)^\s*permissions:\s*write-all\s*$',text): failures.append((str(path),'permissions: write-all'))
            if target_trigger in text and re.search(r'uses:\s*actions/checkout@',text): failures.append((str(path),'pull_request_target + checkout requires isolation review'))
            if untrusted.search(text): failures.append((str(path),'untrusted PR metadata used structurally/in shell'))
            for m in mutable.finditer(text): failures.append((str(path),f'mutable action/workflow ref {m.group(1)}@{m.group(2)}'))
            for m in version_tag.finditer(text): warnings.append(f'{path}: mutable action version tag {m.group(0).strip()}')
            if re.search(r'(?i)(?:curl|wget)[^\n|]*\|\s*(?:sudo\s+)?(?:sh|bash)\b',raw): warnings.append(f'{path}: remote content piped to shell')
            if re.search(r'(?m)^\s*(?:contents|actions|pull-requests):\s*write\s*$',text): warnings.append(f'{path}: write-capable GitHub permission requires review')

          public_secret=re.compile(r'\b(?:VITE_|NEXT_PUBLIC_|REACT_APP_)[A-Z0-9_]*(?:PRIVATE|SECRET|SERVICE_ROLE|ADMIN|SIGNING|ENCRYPTION|JWT)[A-Z0-9_]*\b')
          for file in tracked:
            p=Path(file)
            if '.github' in p.parts or p.suffix.lower() in {'.lock','.png','.jpg','.jpeg','.gif','.webp','.pdf'}: continue
            try:
              if p.stat().st_size<=2_000_000 and public_secret.search(p.read_text('utf-8',errors='ignore')): failures.append((file,'privileged-looking secret uses browser-public env prefix'))
            except Exception: pass

          package=Path('package.json')
          if package.exists():
            try: manifest=json.loads(package.read_text('utf-8'))
            except Exception: manifest={}
            build=manifest.get('build') if isinstance(manifest,dict) else None
            if isinstance(build,dict):
              bad=re.compile(r'(?i)(?:^|/)(?:\.env(?:\.|$)|credentials\.json$|service-account|\.encryption_key$|[^/]+\.(?:pem|p12|pfx|key)$)')
              def walk(v):
                if isinstance(v,str) and bad.search(v.replace('\\','/')): failures.append(('package.json',f'build packages credential material: {v}'))
                elif isinstance(v,list):
                  for x in v: walk(x)
                elif isinstance(v,dict):
                  for x in v.values(): walk(x)
              walk({k:build.get(k) for k in ('files','extraFiles','extraResources') if k in build})

          for w in sorted(set(warnings))[:150]: print(f'::warning::{w}')
          if historical:
            print('::warning::Credential-like material/filenames exist in Git history; rotate/revoke affected credentials before treating them as safe.')
            for p,label in sorted(set(historical))[:150]: print(f' history: {p}: {label}')
          if failures:
            print('Blocking security findings:')
            for p,label in sorted(set(failures)): print(f' - {p}: {label}')
            sys.exit(1)
          print('Credential/history/workflow/packaging audit passed.')
          PY

      - name: Audit production and build dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ] && [ -f package.json ]; then
            npm ci --ignore-scripts
            npm audit --omit=dev --audit-level=high
            npm audit --audit-level=critical
          elif [ -f pnpm-lock.yaml ] && [ -f package.json ]; then
            corepack enable
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm audit --prod --audit-level high
            pnpm audit --audit-level critical
          elif [ -f yarn.lock ] && [ -f package.json ]; then
            echo 'Unsupported Yarn advisory audit coverage; refusing false-green result.' >&2; exit 1
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            echo 'Unsupported Bun advisory audit coverage; refusing false-green result.' >&2; exit 1
          elif [ -f package.json ]; then
            echo 'Node manifest lacks supported lockfile; refusing non-reproducible audit.' >&2; exit 1
          fi
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check -q pip-audit
            pip-audit -r requirements.txt
          elif [ -f pyproject.toml ] || [ -f poetry.lock ] || [ -f uv.lock ]; then
            echo 'Python project metadata lacks requirements.txt audit path; refusing incomplete coverage.' >&2; exit 1
          fi
