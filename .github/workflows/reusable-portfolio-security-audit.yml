name: Reusable Portfolio Security Audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Scan current tree and Git history for credential material
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          MAX_CURRENT_BYTES = 8_000_000
          MAX_HISTORY_BYTES = 4_000_000

          patterns = [
              ('literal private/wallet key', re.compile(r'(?i)(?:private|wallet|secret|clean|compromised)[_ -]*(?:key|keypair|pk)[^\n]{0,100}?(?:0x)?[0-9a-f]{64}')),
              ('secret assignment', re.compile(r'''(?ix)
                  (?:API[_-]?KEY|API[_-]?TOKEN|PRIVATE[_-]?KEY|WALLET[_-]?PRIVATE[_-]?KEY|SECRET[_-]?KEY|
                     CLIENT[_-]?SECRET|APP[_-]?SECRET|JWT[_-]?SECRET|AUTH[_-]?SECRET|AUTH[_-]?TOKEN|
                     ACCESS[_-]?TOKEN|SERVICE[_-]?ROLE[_-]?KEY|SESSION[_-]?STRING|ENCRYPTION[_-]?KEY|
                     DISCORD[_-]?BOT[_-]?TOKEN|TELEGRAM[_-]?BOT[_-]?TOKEN|PASSWORD)
                  \s*[:=]\s*["']?
                  (?!your[_-]|example|replace|change|placeholder|process\.|process\[|os\.|env\.|import\.meta|\$\{|<)
                  [A-Za-z0-9+/=_:.@-]{20,}
              ''')),
              ('Solana keypair array', re.compile(r'(?is)(?:secret|private|wallet)[_ -]*(?:key|keypair|pk)[^=\n]{0,60}[=:]\s*\[(?:\s*\d{1,3}\s*,){31,}\s*\d{1,3}\s*\]')),
              ('Solana base58 secret', re.compile(r'(?i)(?:private|secret|wallet)[_ -]*(?:key|keypair|pk)[^\n]{0,80}?[=:]\s*["\']?[1-9A-HJ-NP-Za-km-z]{80,100}')),
              ('seed phrase assignment', re.compile(r'(?i)(?:mnemonic|seed[_ -]*phrase)\s*[:=]\s*["\']?(?:[a-z]{3,12}\s+){11,23}[a-z]{3,12}')),
              ('PEM private key', re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
              ('GitHub token', re.compile(r'\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})\b')),
              ('OpenAI key', re.compile(r'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b')),
              ('OpenRouter key', re.compile(r'\bsk-or-v1-[A-Za-z0-9_-]{20,}\b')),
              ('Anthropic key', re.compile(r'\bsk-ant-[A-Za-z0-9_-]{20,}\b')),
              ('Google OAuth client secret', re.compile(r'\bGOCSPX-[A-Za-z0-9_-]{20,}\b')),
              ('Google API key', re.compile(r'\bAIza[0-9A-Za-z_-]{30,}\b')),
              ('AWS access key', re.compile(r'\b(?:AKIA|ASIA)[0-9A-Z]{16}\b')),
              ('Telegram token', re.compile(r'\b\d{8,12}:[A-Za-z0-9_-]{30,}\b')),
              ('Stripe live key', re.compile(r'\b(?:sk|rk)_live_[A-Za-z0-9]{16,}\b')),
              ('Slack token', re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{20,}\b')),
              ('npm token', re.compile(r'\bnpm_[A-Za-z0-9]{30,}\b')),
              ('GitLab token', re.compile(r'\bglpat-[A-Za-z0-9_-]{20,}\b')),
              ('Hugging Face token', re.compile(r'\bhf_[A-Za-z0-9]{30,}\b')),
              ('keyed RPC', re.compile(r'https?://[^\s"\']*(?:(?:alchemy\.com/v2|infura\.io/v3)/[A-Za-z0-9_-]{16,}|(?:helius-rpc\.com|helius\.xyz)[^\s"\']*api-key=[A-Za-z0-9_-]{16,})', re.I)),
              ('URL embedded credentials', re.compile(r'(?i)https?://[^\s/:@]{1,100}:[^\s/@]{8,}@[^\s/]+')),
          ]

          forbidden = re.compile(
              r'(^|/)(?:\.env(?:\..+)?|\.pypirc|\.netrc|credentials\.json|service-account[^/]*\.json|'
              r'id_(?:rsa|ed25519)|[^/]+\.(?:pem|p12|pfx|key|jks|keystore))$',
              re.I,
          )
          templates = {'.env.example', 'env.example', '.env.sample', 'env.sample'}
          placeholder_markers = ('your_', 'your-', 'example', 'placeholder', 'replace_', 'replace-', '<redacted>', '<secret>')

          def exempt(path, label):
              return Path(path).name == 'firebase-applet-config.json' and label == 'Google API key'

          def is_placeholder_match(match_text: str) -> bool:
              lowered = match_text.lower()
              return any(marker in lowered for marker in placeholder_markers)

          jwt_re = re.compile(r'\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b')
          def has_service_role_jwt(text: str) -> bool:
              for token in jwt_re.findall(text):
                  try:
                      payload = token.split('.')[1]
                      payload += '=' * (-len(payload) % 4)
                      decoded = json.loads(base64.urlsafe_b64decode(payload).decode('utf-8'))
                  except Exception:
                      continue
                  if str(decoded.get('role', '')).lower() == 'service_role':
                      return True
              return False

          def scan_text(path: str, text: str):
              findings = []
              if has_service_role_jwt(text):
                  findings.append((path, 'Supabase/service-role JWT'))
              for label, pattern in patterns:
                  match = pattern.search(text)
                  if match and not exempt(path, label) and not is_placeholder_match(match.group(0)):
                      findings.append((path, label))
              return findings

          current = []
          warnings = []
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode(errors='ignore').split('\0')
          for file in filter(None, files):
              base = Path(file).name
              normalized = file.replace('\\', '/')
              if forbidden.search(normalized) and base not in templates:
                  current.append((file, 'credential-bearing filename'))
              if base == '.npmrc':
                  try:
                      npmrc = Path(file).read_text('utf-8', errors='ignore')
                  except Exception:
                      npmrc = ''
                  if '_authToken=' in npmrc and '${' not in npmrc:
                      current.append((file, 'literal npm registry credential'))
              try:
                  size = Path(file).stat().st_size
              except OSError:
                  continue
              if size > MAX_CURRENT_BYTES:
                  warnings.append(f'current file not content-scanned (>8 MB): {file}')
                  continue
              try:
                  raw = Path(file).read_bytes()
              except Exception:
                  continue
              text = raw.decode('utf-8', errors='ignore')
              if text.startswith('version https://git-lfs.github.com/spec/v1'):
                  warnings.append(f'Git LFS object content is outside this checkout scan: {file}')
              current.extend(scan_text(file, text))

          try:
              staged = subprocess.check_output(['git', 'ls-files', '--stage'], text=True, errors='ignore')
              for row in staged.splitlines():
                  if row.startswith('160000 '):
                      warnings.append(f'git submodule contents are not recursively scanned: {row.rsplit(chr(9), 1)[-1]}')
          except Exception:
              pass

          if current:
              print('Current-tree credential findings:')
              for file, label in sorted(set(current)):
                  print(f' - {file}: {label}')
              sys.exit(1)

          historical, seen = [], set()
          for row in subprocess.check_output(['git', 'rev-list', '--objects', '--all'], text=True, errors='ignore').splitlines():
              parts = row.split(' ', 1)
              oid = parts[0]
              path = parts[1] if len(parts) > 1 else '<unknown>'
              if oid in seen:
                  continue
              seen.add(oid)
              base = Path(path).name
              if forbidden.search(path.replace('\\', '/')) and base not in templates:
                  historical.append((path, 'historical credential-bearing filename'))
              try:
                  if subprocess.check_output(['git', 'cat-file', '-t', oid], text=True, stderr=subprocess.DEVNULL).strip() != 'blob':
                      continue
                  size = int(subprocess.check_output(['git', 'cat-file', '-s', oid], text=True, stderr=subprocess.DEVNULL).strip())
                  if size > MAX_HISTORY_BYTES:
                      warnings.append(f'historical blob not content-scanned (>4 MB): {path}')
                      continue
                  blob = subprocess.check_output(['git', 'cat-file', '-p', oid], stderr=subprocess.DEVNULL).decode('utf-8', errors='ignore')
              except Exception:
                  continue
              findings = scan_text(path, blob)
              if findings:
                  historical.append(findings[0])

          for warning in sorted(set(warnings))[:100]:
              print(f'::warning::{warning}')
          if historical:
              print('::warning::Credential-like material or credential-bearing filenames exist in Git history; rotation/revocation must be verified before affected credentials are treated as safe.')
              for path, label in sorted(set(historical))[:100]:
                  print(f' history: {path}: {label}')
          else:
              print('Credential scan passed for current tree and scanned history.')
          PY

      - name: Audit workflow and browser/build trust boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          failures = []
          warnings = []
          workflow_paths = list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml')) if Path('.github/workflows').exists() else []
          mutable_ref = re.compile(r'uses:\s*([^\s]+)@(main|master|latest|HEAD)\b', re.I)
          version_tag_ref = re.compile(r'uses:\s*([^\s]+)@v\d+(?:\.\d+)*\b', re.I)
          untrusted_expr = re.compile(r'\$\{\{\s*github\.event\.pull_request\.(?:title|body|head\.ref|head\.label)\s*\}\}')

          for path in workflow_paths:
              text = path.read_text('utf-8', errors='ignore')
              if re.search(r'(?m)^\s*permissions:\s*write-all\s*$', text):
                  failures.append(f'{path}: permissions: write-all is forbidden')
              if 'pull_request_target:' in text and re.search(r'uses:\s*actions/checkout@', text):
                  failures.append(f'{path}: pull_request_target combined with checkout requires manual isolation/review')
              if 'run:' in text and untrusted_expr.search(text):
                  failures.append(f'{path}: untrusted pull-request text is interpolated into shell execution')
              for match in mutable_ref.finditer(text):
                  failures.append(f'{path}: mutable action/workflow ref {match.group(1)}@{match.group(2)}')
              for match in version_tag_ref.finditer(text):
                  warnings.append(f'{path}: action ref is a mutable version tag: {match.group(0).strip()}')
              if re.search(r'(?i)(?:curl|wget)[^\n|]*\|\s*(?:sudo\s+)?(?:sh|bash)\b', text):
                  warnings.append(f'{path}: remote content is piped directly to a shell')
              if re.search(r'(?m)^\s*(?:contents|actions|pull-requests):\s*write\s*$', text):
                  warnings.append(f'{path}: workflow has a write-capable GitHub permission; verify least privilege and event trust')

          public_secret_name = re.compile(r'\b(?:VITE_|NEXT_PUBLIC_|REACT_APP_)[A-Z0-9_]*(?:PRIVATE|SECRET|SERVICE_ROLE|ADMIN|SIGNING|ENCRYPTION|JWT)[A-Z0-9_]*\b')
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  if path.stat().st_size > 2_000_000:
                      continue
                  text = path.read_text('utf-8', errors='ignore')
              except Exception:
                  continue
              if public_secret_name.search(text):
                  failures.append(f'{path}: privileged-looking secret name uses a browser-public environment prefix')

          package = Path('package.json')
          if package.exists():
              try:
                  manifest = json.loads(package.read_text('utf-8'))
              except Exception:
                  manifest = {}
              build = manifest.get('build') if isinstance(manifest, dict) else None
              if isinstance(build, dict):
                  forbidden_packaging = re.compile(r'(?i)(?:^|/)(?:\.env(?:\.|$)|credentials\.json$|service-account|\.encryption_key$|[^/]+\.(?:pem|p12|pfx|key)$)')
                  def walk(value):
                      if isinstance(value, str):
                          if forbidden_packaging.search(value.replace('\\', '/')):
                              failures.append(f'package.json: Electron/build packaging includes credential material pattern: {value}')
                      elif isinstance(value, list):
                          for item in value: walk(item)
                      elif isinstance(value, dict):
                          for item in value.values(): walk(item)
                  walk({k: build.get(k) for k in ('files', 'extraFiles', 'extraResources') if k in build})

          for warning in sorted(set(warnings)):
              print(f'::warning::{warning}')
          if failures:
              print('Trust-boundary audit findings:')
              for finding in sorted(set(failures)):
                  print(f' - {finding}')
              sys.exit(1)
          print('Workflow/browser/build trust-boundary audit passed.')
          PY

      - name: Audit production and build dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ] && [ -f package.json ]; then
            npm ci --ignore-scripts
            npm audit --omit=dev --audit-level=high
            npm audit --audit-level=critical
          elif [ -f pnpm-lock.yaml ] && [ -f package.json ]; then
            corepack enable
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm audit --prod --audit-level high
            pnpm audit --audit-level critical
          elif [ -f yarn.lock ] && [ -f package.json ]; then
            echo 'Unsupported Yarn advisory audit coverage; refusing a false-green result.' >&2
            exit 1
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            echo 'Unsupported Bun advisory audit coverage; refusing a false-green result.' >&2
            exit 1
          elif [ -f package.json ]; then
            echo 'Node manifest exists without a supported lockfile; refusing a non-reproducible dependency audit.' >&2
            exit 1
          fi
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check -q pip-audit
            pip-audit -r requirements.txt
          elif [ -f pyproject.toml ] || [ -f poetry.lock ] || [ -f uv.lock ]; then
            echo 'Python project metadata detected without requirements.txt; refusing incomplete dependency coverage.' >&2
            exit 1
          fi
